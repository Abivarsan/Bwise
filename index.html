      rel="stylesheet"
    />
    <!-- Single Page Apps for GitHub Pages URL Restorer (MIT License - rafgraph/spa-github-pages) -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body class="bg-[#FAF8F5] text-[#1A1612] antialiased selection:bg-amber-400 selection:text-stone-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
